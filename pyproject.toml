[project]
name = "causalpilot-bench"
version = "0.2.0"
description = "Matched visual interventions for embodied decision grounding"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pillow>=10,<13"]

[project.optional-dependencies]
simulator = ["ai2thor==5.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["AsgardBench", "construction"]
